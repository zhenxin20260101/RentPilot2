<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鎮信安東房客資格試算系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>鎮信安東房客試算表</h1>

    <div class="dateLine">
        試算日期：<span id="today"></span>
    </div>

    <div class="action-bar">
        <button class="printBtn" onclick="printPage()">🖨️ 列印試算表</button>
    </div>

    <div class="section shadow-box">
        <h2>審查縣市</h2>
        <select id="city" onchange="calculateAll()">
            <option value="桃園市">桃園市</option>
            <option value="南投縣">南投縣</option>
            <option value="彰化縣">彰化縣</option>
        </select>
    </div>

    <div id="membersContainer"></div>

    <div class="action-bar" style="margin-top: 10px;">
        <button class="addMemberBtn" onclick="addMemberCard()">➕ 新增家庭成員 / 共同承租人</button>
    </div>

    <div class="section result-section shadow-box">
        <h2>全戶資格審查總結果</h2>
        <div id="avgIncome" class="totalBox gray">全戶平均每人月收入：0 元</div>
        <div id="assetTotal" class="totalBox gray">全戶動產總額：0 元</div>
        <div id="propertyTotal" class="totalBox gray">全戶不動產總額：0 元</div>

        <div id="incomeResult"></div>
        <div id="assetResult"></div>
        <div id="propertyResult"></div>
    </div>

    <div id="stamp" class="stamp"></div>

    <script src="script.js"></script>
</body>
</html>
